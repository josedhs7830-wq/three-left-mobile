<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- We only include this to explicitly loosen the CSP of various packager environments. It does not provide any security. -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>three-left-v2.0-1.html</title>
  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    :root, body.is-fullscreen {
      background-color: #000000;
    }
    [hidden] {
      display: none !important;
    }
    h1 {
      font-weight: normal;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    #app, #loading, #error, #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000000;
    }
    #launch {
      background-color: rgba(0, 0, 0, 0.7);
      cursor: pointer;
    }
    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid hsla(0, 100%, 100%, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    #loading {
      
    }
    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;
      width: 200px;
      max-width: 200px;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }
    .loading-text, noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }
    .loading-image {
      margin: 0 0 16px;
    }
    #error-message, #error-stack {
      font-family: monospace;
      max-width: 600px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    #error-stack {
      text-align: left;
      max-height: 200px;
      overflow: auto;
    }
    .control-button {
      width: 2rem;
      height: 2rem;
      padding: 0.375rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
    }
    .control-button-highlight:hover {
      background: #ff4c4c26;
    }
    .control-button-highlight.active {
      background: #ff4c4c59;
    }
    .fullscreen-button {
      background: white;
    }
    .standalone-fullscreen-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 0 0 0 4px;
      padding: 4px;
      cursor: pointer;
    }

    html,body{height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
    :root{--b:min(21vmin,104px);--jb:min(40vmin,200px)}
    #pad{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
    #pad.on{display:block}
    .tb{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font:bold 26px sans-serif;
        background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);border-radius:50%;
        width:var(--b);height:var(--b);user-select:none;-webkit-user-select:none;touch-action:none}
    .tb.down{background:rgba(255,200,0,.55);border-color:#ffd000}
    /* Botones IZQUIERDA */
    #btnzone{position:absolute;left:0;top:25%;width:46%;bottom:0;pointer-events:auto;touch-action:none}
    #acts{position:absolute;left:calc(env(safe-area-inset-left,0px) + 3vmin);bottom:calc(env(safe-area-inset-bottom,0px) + 4vmin);
          width:calc(var(--b)*2.3);height:calc(var(--b)*2.1);pointer-events:none}
    #acts .tb{pointer-events:none}
    #acts .z{right:0;top:0}
    #acts .x{left:0;bottom:0}
    /* Joystick DERECHA */
    #stickzone{position:absolute;right:0;top:20%;width:48%;bottom:0;pointer-events:auto;touch-action:none}
    #sbase{position:absolute;left:0;top:0;width:var(--jb);height:var(--jb);margin:calc(var(--jb)/-2) 0 0 calc(var(--jb)/-2);
           border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.4);pointer-events:none;opacity:.5;will-change:transform}
    #sbase.act{opacity:1;background:rgba(255,255,255,.18)}
    #sknob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;
           background:rgba(255,255,255,.5);border:2px solid #fff;will-change:transform}
    #top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
    #top .tb{position:relative;--b:44px;width:56px;border-radius:14px;font-size:16px;opacity:.75;pointer-events:auto}
    #top .tb::after{content:"";position:absolute;inset:-8px}
    #rot{position:fixed;inset:0;z-index:99;background:#000;color:#fff;display:none;align-items:center;justify-content:center;
         text-align:center;font:20px sans-serif;padding:24px}
    @media (orientation:portrait){#rot{display:flex}}
    .sc-canvas {
      cursor: auto;
    }
    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color {
      background-color: #ff8c1a;
    }
    .sc-monitor-row-value-outer {
      background-color: #fc662c;
    }
    .sc-monitor-row-value-editing .sc-monitor-row-value-outer {
      background-color: #e25b27;
    }
    
  </style>
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="icon.png">
  
</head>
<body>
  <div id="app"></div>
  <div id="rot">📱↻<br><br>Gira el celular en horizontal<br>Rotate your phone to landscape</div>
  <div id="pad">
    <div id="btnzone"></div>
    <div id="acts">
      <div class="tb z" data-k="z">Z</div>
      <div class="tb x" data-k="x">X</div>
    </div>
    <div id="stickzone"><div id="sbase"><div id="sknob"></div></div></div>
    <div id="top">
      <div class="tb" id="bc" data-k="c">C</div>
      <div class="tb" id="fsbtn">⛶</div>
      <div class="tb" id="padbtn">🎮</div>
    </div>
  </div>


  <div id="launch" class="screen" hidden title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs><style>.cls-1,.cls-2{fill:#4cbf56;stroke:#45993d;stroke-linecap:round;stroke-linejoin:round;}.cls-2{stroke-width:1.5px;}</style></defs>
        <path class="cls-1" d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0"/>
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75"/>
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    
    
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <script src="script.js"></script>
  <script>
    const appElement = document.getElementById('app');
    const launchScreen = document.getElementById('launch');
    const loadingScreen = document.getElementById('loading');
    const loadingInner = document.getElementById('loading-inner');
    const errorScreen = document.getElementById('error');
    const errorScreenMessage = document.getElementById('error-message');
    const errorScreenStack = document.getElementById('error-stack');

    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = '' + error;
      let debug = error && error.stack || 'no stack';
      debug += '\nUser agent: ' + navigator.userAgent;
      errorScreenStack.textContent = debug;
    };
    const setProgress = (progress) => {
      if (loadingInner) loadingInner.style.width = progress * 100 + '%';
    };
    const interpolate = (a, b, t) => a + t * (b - a);

    try {
      setProgress(0.1);

      const scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = 480;
      scaffolding.height = 360;
      scaffolding.resizeMode = "preserve-ratio";
      scaffolding.editableLists = false;
      scaffolding.usePackagedRuntime = true;
      scaffolding.setup();
      scaffolding.appendTo(appElement);

      const vm = scaffolding.vm;
      window.scaffolding = scaffolding;
      window.vm = scaffolding.vm;
      window.Scratch = {
        vm,
        renderer: vm.renderer,
        audioEngine: vm.runtime.audioEngine,
        bitmapAdapter: vm.runtime.v2BitmapAdapter,
        videoProvider: vm.runtime.ioDevices.video.provider
      };

      scaffolding.setUsername("player####".replace(/#/g, () => Math.floor(Math.random() * 10)));
      scaffolding.setAccentColor("#ff4c4c");

      

      vm.setTurboMode(false);
      if (vm.setInterpolation) vm.setInterpolation(false);
      if (vm.setFramerate) vm.setFramerate(30);
      if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
      if (vm.setRuntimeOptions) vm.setRuntimeOptions({
        fencing: true,
        miscLimits: true,
        maxClones: 300,
      });
      if (vm.setCompilerOptions) vm.setCompilerOptions({
        enabled: true,
        warpTimer: false
      });
      if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);

      // enforcePrivacy threat model only makes sense in the editor
      if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);

      if (typeof ScaffoldingAddons !== 'undefined') {
        ScaffoldingAddons.run(scaffolding, {"gamepad":false,"pointerlock":false,"specialCloudBehaviors":false,"unsafeCloudBehaviors":false,"pause":false});
      }

      scaffolding.setExtensionSecurityManager({
        getSandboxMode: () => 'unsandboxed',
        canLoadExtensionFromProject: () => true
      });
      for (const extension of []) {
        vm.extensionManager.loadExtensionURL(extension);
      }

    } catch (e) {
      handleError(e);
    }
  </script>
  
  
    <script>
      const getProjectData = (function() {
        const storage = scaffolding.storage;
        storage.onprogress = (total, loaded) => {
          setProgress(interpolate(0.2, 0.98, loaded / total));
        };
        
        storage.addWebStore(
          [
            storage.AssetType.ImageVector,
            storage.AssetType.ImageBitmap,
            storage.AssetType.Sound,
            storage.AssetType.Font
          ].filter(i => i),
          (asset) => new URL('./assets/' + asset.assetId + '.' + asset.dataFormat, location).href
        );
        return () => new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.onload = () => {
          resolve(xhr.response);
        };
        xhr.onerror = () => {
          if (location.protocol === 'file:') {
            reject(new Error('Zip environment must be used on a website, not on a local file. To fix this error, use the "Plain HTML" environment instead.'));
          } else {
            reject(new Error('Request to load project data failed.'));
          }
        };
        xhr.onprogress = (e) => {
          if (e.lengthComputable) {
            setProgress(interpolate(0.1, 0.2, e.loaded / e.total));
          }
        };
        xhr.responseType = 'arraybuffer';
        xhr.open('GET', "./assets/project.json");
        xhr.send();
      });
      })();
    </script>
  <script>
    const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      if (false) {
        scaffolding.start();
      } else {
        launchScreen.hidden = false;
        launchScreen.addEventListener('click', () => {
          launchScreen.hidden = true;
          scaffolding.start();
        });
        launchScreen.focus();
      }
    };
    run().catch(handleError);
  </script>

  <script>
  // ===== Controles táctiles -> teclado de Scratch =====
  (function(){
    const $=id=>document.getElementById(id);
    const pad=$('pad'), btnzone=$('btnzone'), stickzone=$('stickzone'), base=$('sbase'), knob=$('sknob');
    const held={}, since={};
    const vmKey=(k,down)=>{ try{ window.vm.postIOData('keyboard',{key:k,isDown:down}); }catch(e){} };

    // Scratch corre a 30fps (33ms). Un toque mas corto que un frame se perdia: garantizamos 50ms.
    const MIN_HOLD=50;
    const setKey=(k,down)=>{
      if(!!held[k]===down) return;
      if(down){ held[k]=true; since[k]=performance.now(); vmKey(k,true); }
      else{
        held[k]=false;
        const wait=MIN_HOLD-(performance.now()-since[k]);
        if(wait>0) setTimeout(()=>{ if(!held[k]) vmKey(k,false); },wait); else vmKey(k,false);
      }
    };
    const press=(el,down)=>{
      if(!!el._d===down) return; el._d=down;
      el.classList.toggle('down',down);
      setKey(el.dataset.k,down);
      if(down && navigator.vibrate) try{navigator.vibrate(6)}catch(e){}
    };

    // ---------- Botones Z / X (izquierda): deteccion por cercania, mas permisiva ----------
    const MARGIN=26; // px extra alrededor del boton que tambien cuentan como toque
    let rects=[];
    const calcBtns=()=>{ rects=[...document.querySelectorAll('#acts .tb')].map(el=>{
      const r=el.getBoundingClientRect(); return {el,cx:(r.left+r.right)/2,cy:(r.top+r.bottom)/2,r:r.width/2}; }); };
    const nearest=(x,y)=>{ let b=null,bd=1e9;
      for(const o of rects){ const d=Math.hypot(x-o.cx,y-o.cy)-o.r; if(d<bd){bd=d;b=o.el;} }
      return bd<=MARGIN?b:null; };
    const own=new Map();
    btnzone.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const b=nearest(e.clientX,e.clientY); if(!b) return;
      try{btnzone.setPointerCapture(e.pointerId)}catch(_){}
      own.set(e.pointerId,b); press(b,true);
    },{passive:false});
    btnzone.addEventListener('pointermove',e=>{
      const cur=own.get(e.pointerId); if(!cur) return;
      const b=nearest(e.clientX,e.clientY);
      if(b!==cur){ press(cur,false); if(b){ own.set(e.pointerId,b); press(b,true);} else own.delete(e.pointerId); }
    });
    const bUp=e=>{ const b=own.get(e.pointerId); if(b){ press(b,false); own.delete(e.pointerId);} };
    btnzone.addEventListener('pointerup',bUp); btnzone.addEventListener('pointercancel',bUp);

    // Boton C (arriba)
    const bc=$('bc');
    bc.addEventListener('pointerdown',e=>{ e.preventDefault(); try{bc.setPointerCapture(e.pointerId)}catch(_){} press(bc,true); },{passive:false});
    const cUp=()=>press(bc,false);
    bc.addEventListener('pointerup',cUp); bc.addEventListener('pointercancel',cUp);

    // ---------- Joystick flotante (derecha) ----------
    let sid=null, cx=0, cy=0, R=80, zr={left:0,top:0}, px=0, py=0, raf=0;
    const dirs={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};
    const cacheStick=()=>{ const r=stickzone.getBoundingClientRect(); zr={left:r.left,top:r.top,w:r.width,h:r.height};
      R=Math.max(40,base.offsetWidth/2); };
    const restPos=()=>{ base.style.transform='translate('+(zr.w-R-Math.max(16,zr.w*0.06))+'px,'+(zr.h-R-Math.max(16,zr.h*0.06))+'px)'; };
    const draw=()=>{ raf=0; knob.style.transform='translate('+px+'px,'+py+'px)'; base.style.transform='translate('+(cx-zr.left)+'px,'+(cy-zr.top)+'px)'; };
    const queue=()=>{ if(!raf) raf=requestAnimationFrame(draw); };
    const applyDirs=(dx,dy)=>{
      const dz=R*0.16;                         // zona muerta chica = mas sensible
      const ax=Math.abs(dx), ay=Math.abs(dy), maj=Math.max(ax,ay);
      const okX=ax>dz && ax>=maj*0.36, okY=ay>dz && ay>=maj*0.36;
      const want={ArrowRight:okX&&dx>0,ArrowLeft:okX&&dx<0,ArrowDown:okY&&dy>0,ArrowUp:okY&&dy<0};
      for(const k in want){ if(want[k]!==dirs[k]){ dirs[k]=want[k]; setKey(k,want[k]); } }
    };
    const moveStick=(x,y)=>{
      let dx=x-cx, dy=y-cy; const dist=Math.hypot(dx,dy), max=R*0.85;
      if(dist>max){ const k=(dist-max)/dist; cx+=dx*k; cy+=dy*k; dx=x-cx; dy=y-cy; } // el centro sigue al dedo
      px=dx; py=dy; applyDirs(dx,dy); queue();
    };
    stickzone.addEventListener('pointerdown',e=>{
      if(sid!==null) return; e.preventDefault();
      sid=e.pointerId; try{stickzone.setPointerCapture(sid)}catch(_){}
      cx=e.clientX; cy=e.clientY; base.classList.add('act'); px=py=0; moveStick(e.clientX,e.clientY);
    },{passive:false});
    stickzone.addEventListener('pointermove',e=>{ if(e.pointerId===sid) moveStick(e.clientX,e.clientY); });
    const sEnd=e=>{ if(e.pointerId!==sid) return; sid=null; px=py=0; base.classList.remove('act'); applyDirs(0,0);
      if(raf){cancelAnimationFrame(raf);raf=0;} knob.style.transform=''; restPos(); };
    stickzone.addEventListener('pointerup',sEnd); stickzone.addEventListener('pointercancel',sEnd);

    // ---------- UI ----------
    const layout=()=>{ calcBtns(); cacheStick(); if(sid===null) restPos(); };
    window.addEventListener('resize',layout); window.addEventListener('orientationchange',()=>setTimeout(layout,250));
    window.addEventListener('blur',()=>{ document.querySelectorAll('.tb.down').forEach(b=>press(b,false)); applyDirs(0,0); });

    let visible=true;
    $('padbtn').addEventListener('click',()=>{ visible=!visible; btnzone.style.display=stickzone.style.display=$('acts').style.display=visible?'':'none'; if(visible) layout(); });

    const fs=async()=>{
      try{ const el=document.documentElement; if(!document.fullscreenElement) await (el.requestFullscreen||el.webkitRequestFullscreen).call(el); else await document.exitFullscreen(); }catch(e){}
      try{ await screen.orientation.lock('landscape'); }catch(e){}
      setTimeout(layout,300);
    };
    $('fsbtn').addEventListener('click',fs);

    const launch=$('launch');
    launch.addEventListener('click',()=>{ pad.classList.add('on'); layout(); fs(); },{capture:true});
    setTimeout(()=>{ if(launch.hidden){ pad.classList.add('on'); layout(); } },3000);

    document.addEventListener('contextmenu',e=>e.preventDefault());
    document.addEventListener('gesturestart',e=>e.preventDefault());
    const wl=()=>{ try{ navigator.wakeLock&&navigator.wakeLock.request('screen'); }catch(e){} };
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) wl(); });
    launch.addEventListener('click',wl);
  })();
  </script>
</body>
